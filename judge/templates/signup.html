{% extends "base.html" %}
{% block title %}Sign up — ads-ml-lab judge{% endblock %}
{% block content %}
<div class="authbox">
  <h1>Create an account</h1>
  <p class="sub">Accounts exist only to attribute leaderboard rows. The data is downloadable
     without one.</p>
  <form method="post" action="/signup" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email <input type="email" name="email" required autocomplete="email" autofocus></label>
    <label>Display name <span class="hint">shown on leaderboards</span>
      <input type="text" name="display_name" required minlength="2" maxlength="31" autocomplete="nickname"></label>
    <label>Password <span class="hint">10 characters minimum</span>
      <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="alt">Already registered? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
