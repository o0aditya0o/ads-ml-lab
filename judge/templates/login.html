{% extends "base.html" %}
{% block title %}Sign in — ads-ml-lab judge{% endblock %}
{% block content %}
<div class="authbox">
  <h1>Sign in</h1>
  <p class="sub">To submit predictions and appear on the leaderboard.</p>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input type="email" name="email" required autocomplete="email" autofocus></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="alt">No account? <a href="/signup">Sign up</a></p>
</div>
{% endblock %}
